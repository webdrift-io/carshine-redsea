<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · CarShine Red Sea</title>
  <link rel="icon" href="/favicon.png">
  <style>
    :root{
      --bg:#ffffff; --fg:#0a0a0a; --muted:#6b7280; --line:#e5e7eb;
      --field:#ffffff; --field-line:#d4d4d8; --accent:#0a0a0a; --accent-fg:#ffffff;
      --danger:#b91c1c; --radius:12px;
      --shadow:0 1px 2px rgba(0,0,0,.04), 0 12px 40px rgba(0,0,0,.08);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--fg);
      font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
      display:grid; place-items:center; padding:24px;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(0,0,0,.04) 1px, transparent 0);
      background-size:22px 22px;
    }
    .card{
      width:100%; max-width:400px; background:#fff; border:1px solid var(--line);
      border-radius:18px; padding:34px 30px; box-shadow:var(--shadow);
    }
    .brand{display:flex; align-items:center; gap:10px; margin-bottom:26px}
    .brand-mark{
      width:38px; height:38px; border-radius:10px; background:var(--accent);
      color:var(--accent-fg); display:grid; place-items:center; font-weight:800; font-size:15px;
      letter-spacing:-.02em;
    }
    .brand-name{font-weight:800; letter-spacing:-.02em; font-size:1.02rem}
    .brand-name span{color:var(--muted); font-weight:600}
    h1{font-size:1.35rem; margin:0 0 4px; letter-spacing:-.02em}
    .sub{color:var(--muted); font-size:.9rem; margin:0 0 24px}
    label{display:block; font-size:.8rem; font-weight:600; margin:0 0 7px; color:#27272a}
    .field{
      width:100%; height:44px; padding:0 13px; margin-bottom:16px;
      border:1px solid var(--field-line); border-radius:var(--radius); background:var(--field);
      font:inherit; font-size:.92rem; color:var(--fg); transition:border-color .15s, box-shadow .15s;
    }
    .field:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,0,0,.08)}
    .btn{
      width:100%; height:46px; border:0; border-radius:var(--radius);
      background:var(--accent); color:var(--accent-fg); font-weight:700; font-size:.93rem;
      cursor:pointer; transition:opacity .15s, transform .05s; letter-spacing:.01em;
    }
    .btn:hover{opacity:.9}
    .btn:active{transform:translateY(1px)}
    .btn[disabled]{opacity:.55; cursor:default}
    .msg{min-height:20px; margin:14px 0 0; font-size:.85rem; text-align:center}
    .msg.err{color:var(--danger)}
    .msg.ok{color:#15803d}
    .foot{margin-top:22px; text-align:center; font-size:.78rem; color:var(--muted)}
    .foot a{color:var(--fg); text-decoration:none; font-weight:600}
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="brand">
      <div class="brand-mark">CS</div>
      <div class="brand-name">CarShine <span>Red Sea</span></div>
    </div>
    <h1>Sign in</h1>
    <p class="sub">Admin access to the operations dashboard.</p>
    <form id="login-form" autocomplete="on">
      <label for="email">Email</label>
      <input class="field" type="email" id="email" name="email" required autocomplete="username" placeholder="you@carshineredsea.com" autofocus>
      <label for="password">Password</label>
      <input class="field" type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••••••">
      <button class="btn" type="submit" id="submit">Sign in</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
    <div class="foot"><a href="/">← Back to website</a></div>
  </main>

  <script>
    (function () {
      var TOKEN_KEY = 'carshine_admin_token';
      var form = document.getElementById('login-form');
      var msg = document.getElementById('msg');
      var btn = document.getElementById('submit');

      function nextUrl() {
        var p = new URLSearchParams(location.search).get('next');
        // only allow same-site relative paths
        if (p && /^\/[A-Za-z0-9/_-]*$/.test(p)) return p;
        return '/dashboard/';
      }

      // If already signed in with a valid token, skip the form.
      var existing = localStorage.getItem(TOKEN_KEY);
      if (existing) {
        fetch('/api/auth/verify', { headers: { Authorization: 'Bearer ' + existing } })
          .then(function (r) { if (r.ok) location.replace(nextUrl()); })
          .catch(function () {});
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;
        msg.className = 'msg'; msg.textContent = 'Signing in…';
        btn.disabled = true;
        fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (!res.ok || !res.d.token) {
              msg.className = 'msg err';
              msg.textContent = res.d.error || 'Invalid email or password.';
              btn.disabled = false;
              return;
            }
            localStorage.setItem(TOKEN_KEY, res.d.token);
            msg.className = 'msg ok';
            msg.textContent = 'Welcome back. Loading dashboard…';
            location.replace(nextUrl());
          })
          .catch(function (err) {
            msg.className = 'msg err';
            msg.textContent = 'Network error: ' + err.message;
            btn.disabled = false;
          });
      });
    })();
  </script>
</body>
</html>
