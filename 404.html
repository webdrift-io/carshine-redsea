<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Page not found | CarShine Red Sea</title>
  <link rel="icon" type="image/png" href="/assets/brand/carshine-logo-new.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070a;
      --panel: rgba(255, 255, 255, 0.07);
      --line: rgba(255, 255, 255, 0.14);
      --text: #f8fafc;
      --muted: #a9b1bd;
      --gold: #d7b46a;
      --blue: #6dd7ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        linear-gradient(135deg, rgba(215, 180, 106, 0.18), transparent 34%),
        radial-gradient(circle at 78% 18%, rgba(109, 215, 255, 0.16), transparent 30%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(760px, 100%);
      padding: clamp(28px, 7vw, 64px);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.045));
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.45);
      text-align: center;
      backdrop-filter: blur(18px);
    }

    img {
      width: 86px;
      height: 86px;
      object-fit: contain;
      margin-bottom: 24px;
      filter: drop-shadow(0 16px 32px rgba(0,0,0,0.36));
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 84px);
      line-height: .95;
      letter-spacing: 0;
    }

    p {
      margin: 20px auto 0;
      max-width: 560px;
      color: var(--muted);
      font-size: clamp(16px, 2.5vw, 19px);
      line-height: 1.65;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 34px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 18px;
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      font-weight: 800;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    a.primary {
      color: #081014;
      background: linear-gradient(135deg, var(--gold), var(--blue));
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <img src="/assets/brand/carshine-logo-new.png" alt="CarShine Red Sea">
    <p class="eyebrow">404 - Page not found</p>
    <h1>This road is not open yet.</h1>
    <p>The page you requested does not exist, moved, or needs the live Node dashboard to be started from Hostinger.</p>
    <div class="actions">
      <a class="primary" href="/">Back to website</a>
      <a href="/dashboard-v2">Open dashboard</a>
      <a href="/#booking">Book a wash</a>
    </div>
  </main>
</body>
</html>
