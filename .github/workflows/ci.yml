name: CarShine Service Agent CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.19.0'

jobs:
  test:
    name: Test, Lint, Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: service-agent/package-lock.json
      
      - name: Install dependencies
        working-directory: service-agent
        run: npm ci
      
      - name: Run linter
        working-directory: service-agent
        run: npm run lint
      
      - name: Check formatting
        working-directory: service-agent
        run: npm run format:check
      
      - name: Type check
        working-directory: service-agent
        run: npm run typecheck
        continue-on-error: true  # TS is loose for now
      
      - name: Run tests
        working-directory: service-agent
        run: npm test

      - name: Install Playwright browsers
        working-directory: service-agent
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: service-agent
        run: npm run test:e2e
        env:
          NODE_ENV: test
          USE_MASTRA_AGENT: 'true'
      
      - name: Generate coverage report
        working-directory: service-agent
        run: npm run test:coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: service-agent/coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false
        continue-on-error: true
      
      - name: Build verification (dry-run)
        working-directory: service-agent
        run: node -e "require('./server.js')" &
        env:
          PORT: 15000
          NODE_ENV: test
        # Just verify the file parses and loads (will fail at listen but that's fine)
        continue-on-error: true
        timeout: 30

  landing-build:
    name: Landing Page Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify canonical source pages exist
        run: |
          for f in index.html ar/index.html de/index.html; do
            if [ ! -f "$f" ]; then echo "❌ Canonical source missing: $f"; exit 1; fi
          done
          echo "✅ Canonical landing sources present (index.html, ar/, de/)"

      - name: Build optimized landing (root vite)
        run: npm run build:all

      - name: Verify build output
        run: |
          for f in dist/index.html dist/ar/index.html dist/de/index.html; do
            if [ ! -f "$f" ]; then echo "❌ Build output missing: $f"; exit 1; fi
          done
          echo "✅ All language builds present"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: landing-page-build
          path: dist/
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies (root)
        run: npm ci
      
      - name: Audit dependencies (root)
        run: npm audit --audit-level=high
      
      - name: Install dependencies (service-agent)
        working-directory: service-agent
        run: npm ci
      
      - name: Audit dependencies (service-agent)
        working-directory: service-agent
        run: npm audit --audit-level=high

      - name: Check for hardcoded secrets
        run: |
          if grep -rE '(sk-proj-[a-zA-Z0-9]{20,}|sk_[a-zA-Z0-9]{40,}|AKIA[0-9A-Z]{16})' --include='*.js' --include='*.json' --include='*.md' . 2>/dev/null | grep -v node_modules | grep -v 'YOUR_' | grep -v '_KEY=your' | head -5; then
            echo "⚠️  Potential hardcoded secrets found - review above"
          else
            echo "✅ No hardcoded secrets detected"
          fi

  deploy:
    name: Deploy (on main)
    runs-on: ubuntu-latest
    needs: [test, landing-build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    environment:
      name: production
      url: https://carshineredsea.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install production dependencies
        working-directory: service-agent
        run: npm ci --omit=dev
      
      - name: Create deployment package
        run: |
          mkdir -p deploy
          DEPLOY_FILES="package.json server.js database.js minimax-agent.js gemini-chatbot.js parsers.js logger.js openapi.yaml website-knowledge.js chatbot.js"
          for f in $DEPLOY_FILES; do cp "service-agent/$f" deploy/ 2>/dev/null || true; done
          DEPLOY_DIRS="routes public agents services migrations middleware memory observability jobs data"
          for d in $DEPLOY_DIRS; do cp -r "service-agent/$d" deploy/ 2>/dev/null || true; done
          # Canonical landing = raw self-contained root pages (verified-working).
          mkdir -p deploy/public-landing
          cp index.html deploy/public-landing/index.html
          cp -r ar deploy/public-landing/ar
          cp -r de deploy/public-landing/de
          cp favicon.png deploy/public-landing/ 2>/dev/null || true
          cp favicon.ico deploy/public-landing/ 2>/dev/null || true
          cp -r tiktok-marketing deploy/
          cd deploy
          echo "node_modules/" > .gitignore
          echo ".env" >> .gitignore
          echo "database.sqlite" >> .gitignore
          cd ..
          tar -czf deploy.tar.gz deploy/
      
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: deploy.tar.gz
          retention-days: 30
      
      # Add your actual deploy step here:
      # - name: Deploy to server
      #   uses: appleboy/ssh-action@master
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_SSH_KEY }}
      #     script: |
      #       cd /app
      #       tar -xzf deploy.tar.gz
      #       npm install --production
      #       pm2 restart carshine-agent

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test, landing-build, security, deploy]
    if: failure()
    
    steps:
      - name: Notify failure
        run: |
          echo "❌ Pipeline failed - check logs above"
          echo "::error::CI pipeline failed. Please review the workflow run."
